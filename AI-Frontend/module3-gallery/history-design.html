<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Project Details</title>


    <link
        rel="stylesheet"
        href="history-design.css"
    >

</head>


<body>


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="page-header">

        <button
            onclick="window.location.href='history.html'"
        >
            ← Back
        </button>


        <h1 id="project-title">
            Project
        </h1>

    </header>



    <!-- =====================================
         MAIN PAGE
    ====================================== -->

    <main class="details-page">


        <!-- =================================
             LIVE PREVIEW
        ================================== -->

        <section class="preview-section">

            <h2>
                Live Preview
            </h2>


            <button
                id="open-preview"
                class="view-preview-btn"
                type="button"
            >
                View Preview
            </button>


            <!-- Small preview -->

            <div class="preview-wrapper">

                <iframe
                    id="live-preview"
                    title="Live Project Preview"
                    sandbox="allow-scripts"
                ></iframe>

            </div>

        </section>



        <!-- =================================
             CODE
        ================================== -->

        <section class="code-section">

            <h2>
                Code
            </h2>


            <div class="code-tabs">

                <button
                    class="active"
                    data-code="html"
                    type="button"
                >
                    HTML
                </button>


                <button
                    data-code="css"
                    type="button"
                >
                    CSS
                </button>


                <button
                    data-code="js"
                    type="button"
                >
                    JavaScript
                </button>

            </div>


            <pre id="code-output"></pre>

        </section>



        <!-- =================================
             CODE EXPLANATION
        ================================== -->

        <section class="explanation-section">

            <h2>
                Code Explanation
            </h2>


            <div id="explanation"></div>

        </section>



        <!-- =================================
             TAG EXPLANATION
        ================================== -->

        <section class="tags-section">

            <h2>
                Tag Explanation
            </h2>


            <div id="tag-explanation"></div>

        </section>


    </main>



    <!-- =====================================
         FULL SCREEN PREVIEW
    ====================================== -->

    <div
        id="fullscreen-preview"
        class="fullscreen-preview"
    >


        <!-- CLOSE BUTTON -->

        <button
            id="close-preview"
            class="close-preview"
            type="button"
            aria-label="Close preview"
        >

            ✕

        </button>


        <!-- FULLSCREEN IFRAME -->

        <iframe
            id="fullscreen-preview-frame"
            title="Full Screen Project Preview"
            sandbox="allow-scripts"
        ></iframe>


    </div>



    <script src="history-design.js"></script>


</body>

</html>
